<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modul B - Izin Keluar Plant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .bg-animated {
            background: linear-gradient(-45deg, #0f172a, #064e3b, #0f2027, #022c22); /* Nuansa hijau gelap untuk Modul B */
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }
        .panel-transition { transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
        #rfidInput { position: absolute; opacity: 0; top: -1000px; }
        .text-glow-time { text-shadow: 0 0 40px rgba(52, 211, 153, 0.6); }
        .text-glow-return { text-shadow: 0 0 40px rgba(96, 165, 250, 0.6); }

        /* Custom Scrollbar Premium untuk List Panel Kiri */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body class="bg-animated h-screen w-screen flex flex-col justify-center items-center overflow-hidden font-sans text-slate-100 relative p-8">

    <button onclick="window.location.href='index.html'" class="absolute top-8 left-8 w-12 h-12 rounded-full bg-white/5 backdrop-blur-md border border-white/10 shadow-lg flex items-center justify-center text-slate-400 hover:text-white hover:bg-white/20 transition-all duration-300 z-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
        </svg>
    </button>

    <button id="btnInject" class="absolute bottom-4 right-4 px-4 py-2 bg-slate-800/50 text-slate-500 text-xs rounded hover:bg-slate-700 hover:text-white transition z-50">
        Inject Data Master
    </button>

    <div id="mainContainer" class="flex w-full max-w-[1400px] h-[85vh] gap-8 panel-transition">
        
        <div id="leftPanel" class="w-full h-full bg-white/5 backdrop-blur-xl border border-white/10 rounded-[2.5rem] shadow-2xl flex flex-col p-10 panel-transition relative overflow-hidden">
            <div class="absolute -top-32 -right-32 w-64 h-64 bg-emerald-500/20 rounded-full blur-3xl pointer-events-none"></div>
            
            <div class="z-10 flex flex-col h-full">
                <div class="flex items-center justify-between mb-8 border-b border-white/10 pb-6">
                    <div>
                        <h2 class="text-xl font-medium text-slate-300 tracking-[0.2em] uppercase">Status Izin Keluar</h2>
                        <p class="text-sm text-slate-400 mt-1">Manpower di luar area pabrik</p>
                    </div>
                    <div class="bg-emerald-500/20 border border-emerald-500/30 rounded-2xl px-6 py-4 text-center">
                        <span class="block text-4xl font-bold text-emerald-400 leading-none" id="totalOut">0</span>
                        <span class="text-xs uppercase tracking-widest text-emerald-300/80 mt-1 block">Orang</span>
                    </div>
                </div>

                <div class="flex-grow overflow-hidden flex flex-col">
                    <p class="text-xs font-semibold text-slate-500 tracking-widest uppercase mb-4">Daftar Manpower Keluar</p>
                    
                    <div id="outList" class="flex-grow overflow-y-auto custom-scrollbar pr-3 space-y-3">
                        <div id="emptyState" class="h-full flex flex-col items-center justify-center text-slate-500/70">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mb-3 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                            </svg>
                            <p class="text-sm uppercase tracking-widest">Seluruh MP Berada di Dalam Plant</p>
                        </div>
                        </div>
                </div>
                
                <div class="mt-6 text-center">
                    <span class="inline-block px-8 py-2 rounded-full bg-slate-800/50 border border-slate-600/50 text-emerald-300/80 font-semibold tracking-widest text-xs uppercase animate-pulse">
                        Siap Membaca RFID ...
                    </span>
                </div>
            </div>
        </div>

        <div id="rightPanel" class="w-0 opacity-0 scale-95 overflow-hidden bg-slate-800 border border-slate-600 rounded-[2.5rem] shadow-2xl flex flex-col relative panel-transition">
            
            <div class="flex-grow flex flex-col justify-center p-10 relative">
                <div id="loadingState" class="absolute inset-0 bg-slate-800 z-20 flex flex-col items-center justify-center hidden">
                    <div class="w-12 h-12 border-4 border-emerald-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="text-slate-400">Menyinkronkan Data...</p>
                </div>

                <div class="mb-6 whitespace-nowrap">
                    <h3 class="text-4xl font-extrabold text-white mb-2 truncate" id="scanName">-</h3>
                    <p class="text-xl text-emerald-400 font-medium tracking-wide" id="scanDept">-</p>
                    
                    <div class="mt-4 inline-flex items-center px-4 py-2 bg-slate-700/50 rounded-lg border border-slate-600">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-slate-400 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                        </svg>
                        <div>
                            <p class="text-[0.65rem] uppercase tracking-wider text-slate-400">Atasan Langsung</p>
                            <p class="text-sm font-semibold text-slate-200" id="scanAtasan">-</p>
                        </div>
                    </div>
                </div>

                <div id="statusContainer" class="bg-slate-900/80 rounded-3xl p-6 border text-center relative overflow-hidden flex-grow flex flex-col justify-center mb-4">
                    <p id="statusLabel" class="text-lg font-bold tracking-widest uppercase mb-1">STATUS</p>
                    
                    <div id="statusContent" class="text-[9rem] font-mono font-black leading-none tracking-tighter mt-2">
                        00:00
                    </div>
                </div>

                <div class="bg-slate-900/50 rounded-xl p-4 border border-slate-700">
                    <p class="text-[0.7rem] font-semibold text-slate-500 uppercase tracking-widest mb-1">Alasan Keluar</p>
                    <p id="scanAlasan" class="text-sm text-slate-300 italic line-clamp-2">
                        Menunggu input dari aplikasi mobile Security...
                    </p>
                </div>
            </div>

            <div class="w-full h-2 bg-slate-700 absolute bottom-0 left-0">
                <div id="timerBar" class="h-full bg-emerald-500 w-full origin-left"></div>
            </div>
        </div>
    </div>

    <input type="text" id="rfidInput" autocomplete="off" autofocus>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBbPD2u_3P_HcgHBs1uLrkXV3CKKUw64HQ",
            authDomain: "ga-security-afd58.firebaseapp.com",
            projectId: "ga-security-afd58",
            storageBucket: "ga-security-afd58.firebasestorage.app",
            messagingSenderId: "335637796681",
            appId: "1:335637796681:web:84559dbdf54eadc3bf2c98"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // --- STATE TRANSAKSI IZIN KELUAR ---
        let activePermits = {}; // Melacak MP yang sedang di luar: { "uid": { nama, dept, waktuKeluar } }

        // --- UI ELEMENTS ---
        const leftPanel = document.getElementById('leftPanel');
        const rightPanel = document.getElementById('rightPanel');
        const rfidInput = document.getElementById('rfidInput');
        const timerBar = document.getElementById('timerBar');
        const loadingState = document.getElementById('loadingState');
        const outList = document.getElementById('outList');
        const emptyState = document.getElementById('emptyState');
        let splitScreenTimer; 

        document.onclick = () => { rfidInput.focus(); };

        rfidInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const uid = this.value.trim();
                this.value = ''; 
                if(uid !== "") processExitPermit(uid);
            }
        });

        // Fungsi memperbarui UI Daftar di Panel Kiri
        function updateLeftPanelList() {
            const permits = Object.values(activePermits);
            document.getElementById('totalOut').textContent = permits.length;

            if (permits.length === 0) {
                emptyState.style.display = 'flex';
                // Hapus semua card yang ada
                Array.from(outList.children).forEach(child => {
                    if (child.id !== 'emptyState') child.remove();
                });
            } else {
                emptyState.style.display = 'none';
                // Bersihkan list sebelum re-render
                Array.from(outList.children).forEach(child => {
                    if (child.id !== 'emptyState') child.remove();
                });

                // Generate ulang list (Terbaru di atas)
                permits.reverse().forEach(permit => {
                    const card = document.createElement('div');
                    card.className = "bg-slate-800/60 border border-slate-600/50 rounded-xl p-4 flex justify-between items-center transform transition hover:bg-slate-700/60";
                    card.innerHTML = `
                        <div>
                            <p class="font-bold text-slate-200 truncate w-48">${permit.nama}</p>
                            <p class="text-xs text-slate-400">${permit.dept}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-[0.65rem] uppercase tracking-wider text-slate-500 mb-0.5">Keluar</p>
                            <p class="font-mono font-semibold text-emerald-400 bg-emerald-900/30 px-2 py-1 rounded">${permit.waktuKeluar}</p>
                        </div>
                    `;
                    outList.appendChild(card);
                });
            }
        }

        async function processExitPermit(uid) {
            clearTimeout(splitScreenTimer);
            openSplitScreen();
            loadingState.classList.remove('hidden');

            try {
                // 1. Ambil Data Karyawan (Master Data)
                const docRef = doc(db, "users", uid);
                const docSnap = await getDoc(docRef);
                
                let user;
                if (docSnap.exists()) {
                    user = docSnap.data();
                } else {
                    user = { nama: "UID: " + uid, departemen: "Tidak Terdaftar", atasan_langsung: "-" };
                }

                loadingState.classList.add('hidden');

                // Dapatkan Waktu Real-Time (HH:MM)
                const now = new Date();
                const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }).replace(/\./g, ':');

                // Update UI Profil
                document.getElementById('scanName').textContent = user.nama;
                document.getElementById('scanDept').textContent = user.departemen;
                document.getElementById('scanAtasan').textContent = user.atasan_langsung;

                const statusContainer = document.getElementById('statusContainer');
                const statusLabel = document.getElementById('statusLabel');
                const statusContent = document.getElementById('statusContent');
                const scanAlasan = document.getElementById('scanAlasan');

                statusContainer.className = "bg-slate-900/80 rounded-3xl p-6 border text-center relative overflow-hidden flex-grow flex flex-col justify-center mb-4 transition-colors duration-300";

                // 2. LOGIKA KELUAR vs KEMBALI
                if (activePermits[uid]) {
                    // MP SEDANG KEMBALI MASUK PLANT
                    delete activePermits[uid]; // Hapus dari daftar aktif
                    
                    statusContainer.classList.add('border-blue-500/50');
                    statusLabel.textContent = "WAKTU KEMBALI";
                    statusLabel.className = "text-2xl font-bold tracking-widest text-blue-400 mb-1";
                    
                    statusContent.textContent = timeString;
                    statusContent.className = "text-[9rem] font-mono font-black leading-none tracking-tighter mt-2 text-blue-300 text-glow-return";
                    
                    scanAlasan.textContent = "Manpower telah kembali ke dalam area Plant.";
                    scanAlasan.classList.replace('text-slate-300', 'text-blue-400');

                    await addDoc(collection(db, "logs_izin_keluar"), {
                        uid: uid, nama: user.nama, aktivitas: "Masuk Plant", waktu: now.toISOString()
                    });

                } else {
                    // MP SEDANG KELUAR PLANT
                    activePermits[uid] = {
                        nama: user.nama,
                        dept: user.departemen,
                        waktuKeluar: timeString
                    };
                    
                    statusContainer.classList.add('border-emerald-500/50');
                    statusLabel.textContent = "WAKTU KELUAR";
                    statusLabel.className = "text-2xl font-bold tracking-widest text-emerald-400 mb-1";
                    
                    statusContent.textContent = timeString;
                    statusContent.className = "text-[9rem] font-mono font-black leading-none tracking-tighter mt-2 text-emerald-300 text-glow-time";
                    
                    scanAlasan.textContent = "Data alasan sedang disinkronkan atau menunggu input aplikasi mobile Pos Security.";
                    scanAlasan.classList.replace('text-blue-400', 'text-slate-300'); // Reset color

                    await addDoc(collection(db, "logs_izin_keluar"), {
                        uid: uid, nama: user.nama, aktivitas: "Keluar Plant", waktu: now.toISOString()
                    });
                }

                // Update UI Daftar di Panel Kiri
                updateLeftPanelList();

                // 3. Jalankan Bar 20 Detik
                timerBar.style.transition = 'none';
                timerBar.style.transform = 'scaleX(1)';
                setTimeout(() => {
                    timerBar.style.transition = 'transform 20s linear';
                    timerBar.style.transform = 'scaleX(0)';
                }, 50);

                splitScreenTimer = setTimeout(() => { closeSplitScreen(); }, 20000);

            } catch (error) {
                console.error("Error Firestore: ", error);
                loadingState.innerHTML = `<p class="text-red-400 font-bold">Koneksi Database Gagal</p>`;
            }
        }

        function openSplitScreen() {
            leftPanel.classList.remove('w-full');
            leftPanel.classList.add('w-1/2');
            rightPanel.classList.remove('w-0', 'opacity-0', 'scale-95');
            rightPanel.classList.add('w-1/2', 'opacity-100', 'scale-100');
        }

        function closeSplitScreen() {
            rightPanel.classList.remove('w-1/2', 'opacity-100', 'scale-100');
            rightPanel.classList.add('w-0', 'opacity-0', 'scale-95');
            leftPanel.classList.remove('w-1/2');
            leftPanel.classList.add('w-full');
            rfidInput.focus();
        }

        // --- TOMBOL INJECT DATA MASTER (Tambahan) ---
        document.getElementById('btnInject').addEventListener('click', async () => {
            const btn = document.getElementById('btnInject');
            btn.textContent = "Menyimpan ke Firebase...";
            
            const dummyData = [
                { uid: "111", nama: "R. A. Sugiantoro", departemen: "HRDGA Asst.Manager", izin_bawa_hp: true, atasan_langsung: "Kinenta Harsono" },
                { uid: "222", nama: "Ari Rafiar", departemen: "GA Leader", izin_bawa_hp: true, atasan_langsung: "R. A. Sugiantoro" },
                { uid: "333", nama: "Lala", departemen: "Staff Production", izin_bawa_hp: false, atasan_langsung: "Nia Nurazizah" },
                { uid: "444", nama: "Irfan", departemen: "Production", izin_bawa_hp: false, atasan_langsung: "Arie Ratna Mulia" },
                { uid: "555", nama: "Pegawai Training", departemen: "Learning & Development", izin_bawa_hp: true, atasan_langsung: "Maulana Iqbal" } // Data tambahan
            ];

            try {
                for (const d of dummyData) {
                    await setDoc(doc(db, "users", d.uid), {
                        nama: d.nama, departemen: d.departemen, izin_bawa_hp: d.izin_bawa_hp, atasan_langsung: d.atasan_langsung
                    });
                }
                alert("Berhasil! Data Master sudah di-inject ke Firestore.");
                btn.classList.add('hidden');
            } catch (error) {
                alert("Gagal Injeksi: " + error.message);
            }
        });
    </script>
</body>
</html>
