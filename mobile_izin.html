<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Security - Izin Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overscroll-behavior-y: none; }
        .slide-left-enter { transform: translateX(100%); opacity: 0; }
        .slide-left-active { transform: translateX(0); opacity: 1; transition: all 0.3s ease-out; }
        .slide-right-enter { transform: translateX(-100%); opacity: 0; }
        .slide-right-active { transform: translateX(0); opacity: 1; transition: all 0.3s ease-out; }
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-active { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased h-screen flex justify-center overflow-hidden">

    <!-- MOBILE APP CONTAINER -->
    <div class="w-full max-w-md bg-slate-900 h-full flex flex-col relative shadow-2xl border-x border-slate-800 overflow-hidden">
        
        <!-- HEADER -->
        <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 px-5 py-4 flex items-center justify-between sticky top-0 z-20">
            <div class="flex items-center">
                <!-- Tombol Kembali ke List (Hanya muncul di Form View) -->
                <button id="btnBackList" class="hidden w-9 h-9 -ml-1 mr-2 rounded-full flex items-center justify-center text-emerald-400 hover:bg-slate-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>

                <!-- Tombol Kembali ke Portal Menu (Muncul di List View) -->
                <a href="portal_mobile.html" id="btnToPortal" class="w-9 h-9 -ml-1 mr-2 rounded-full flex items-center justify-center bg-slate-700/60 text-slate-300 hover:text-white hover:bg-slate-700 transition" title="Kembali ke Portal Menu">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6A2.25 2.25 0 0 1 6 3.75h2.25A2.25 2.25 0 0 1 10.5 6v2.25a2.25 2.25 0 0 1-2.25 2.25H6a2.25 2.25 0 0 1-2.25-2.25V6ZM3.75 15.75A2.25 2.25 0 0 1 6 13.5h2.25a2.25 2.25 0 0 1 2.25 2.25V18a2.25 2.25 0 0 1-2.25 2.25H6A2.25 2.25 0 0 1 3.75 18v-2.25ZM13.5 6a2.25 2.25 0 0 1 2.25-2.25H18A2.25 2.25 0 0 1 20.25 6v2.25A2.25 2.25 0 0 1 18 10.5h-2.25a2.25 2.25 0 0 1-2.25-2.25V6ZM13.5 15.75a2.25 2.25 0 0 1 2.25-2.25H18a2.25 2.25 0 0 1 2.25 2.25V18A2.25 2.25 0 0 1 18 20.25h-2.25A2.25 2.25 0 0 1 13.5 18v-2.25Z" />
                    </svg>
                </a>

                <div>
                    <h1 class="text-base font-bold text-white tracking-wide" id="headerTitle">Antrean Izin Keluar</h1>
                    <p class="text-[0.6rem] text-emerald-400 font-medium tracking-widest uppercase" id="headerSubtitle">Input Security</p>
                </div>
            </div>
        </header>

        <!-- VIEW 1: DAFTAR ANTREAN -->
        <main id="listView" class="flex-grow overflow-y-auto p-5 pb-24 slide-left-active w-full absolute top-[68px] bottom-0">
            <div class="flex justify-between items-end mb-4">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Menunggu Di-input</p>
                <span class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2 py-1 rounded-md border border-emerald-500/30" id="badgeCount">0 Orang</span>
            </div>

            <div id="pendingListContainer" class="space-y-3">
                <div id="emptyState" class="flex flex-col items-center justify-center h-48 text-slate-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    <p class="text-sm">Tidak ada antrean input alasan.</p>
                </div>
            </div>
        </main>

        <!-- VIEW 2: FORM INPUT ALASAN & ESTIMASI -->
        <main id="formView" class="flex-grow overflow-y-auto p-5 pb-24 hidden w-full absolute top-[68px] bottom-0 bg-slate-900 z-10">
            
            <!-- Profil Target -->
            <div class="bg-emerald-900/20 border border-emerald-500/30 rounded-2xl p-4 mb-5 flex items-center gap-4 shadow-lg shadow-emerald-900/10">
                <div class="w-11 h-11 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/50 shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <div class="overflow-hidden">
                    <p class="text-[0.6rem] text-emerald-400 font-semibold uppercase tracking-widest mb-0.5">Karyawan Terpilih</p>
                    <h2 id="formName" class="text-base font-bold text-white truncate">Nama Karyawan</h2>
                    <p id="formDept" class="text-xs text-slate-400 truncate">Departemen</p>
                </div>
            </div>

            <!-- Form Isian -->
            <div class="space-y-4">
                <!-- 1. Kategori Keluar -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1.5">Kategori Tujuan</label>
                    <select id="inputTujuan" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 appearance-none shadow-inner text-sm">
                        <option value="" disabled selected>Pilih Kategori...</option>
                        <option value="Keperluan Dinas">Keperluan Dinas (Pekerjaan)</option>
                        <option value="Keperluan Pribadi">Keperluan Pribadi / Darurat</option>
                        <option value="Lain-lain">Lain-lain</option>
                    </select>
                </div>

                <!-- 2. Rencana Kepulangan (Radio Pill) -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1.5">Status Kepulangan</label>
                    <div class="grid grid-cols-2 gap-3">
                        <button type="button" id="btnPillKembali" class="py-3 px-3 rounded-xl border text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all border-emerald-500 bg-emerald-500/20 text-emerald-300">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3" /></svg>
                            Kembali ke Plant
                        </button>
                        <button type="button" id="btnPillPulang" class="py-3 px-3 rounded-xl border border-slate-700 bg-slate-800/60 text-slate-400 text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                            Langsung Pulang
                        </button>
                    </div>
                </div>

                <!-- 3. Estimasi Waktu Masuk (Muncul jika Kembali ke Plant) -->
                <div id="boxEstimasi" class="transition-all duration-300 overflow-hidden">
                    <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-widest mb-1.5">Estimasi Jam Kembali (HH:MM)</label>
                    <div class="relative">
                        <input type="time" id="inputEstimasi" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white font-mono text-base focus:outline-none focus:border-emerald-500 shadow-inner">
                    </div>
                    <p class="text-[0.65rem] text-slate-500 mt-1">*Digunakan sebagai acuan pengecekan keterlambatan</p>
                </div>

                <!-- 4. Catatan / Detail Alasan -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-1.5">Detail Alasan / Keperluan</label>
                    <textarea id="inputCatatan" rows="3" placeholder="Ketik alasan spesifik di sini..." class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition resize-none shadow-inner"></textarea>
                </div>
            </div>

            <!-- Tombol Simpan -->
            <button id="btnSubmit" disabled class="w-full mt-6 bg-slate-700 text-slate-400 font-bold rounded-xl py-4 uppercase tracking-widest text-sm transition-all duration-300 flex items-center justify-center">
                Simpan & Sinkronkan
            </button>
        </main>

        <!-- TOAST NOTIFICATION -->
        <div id="toast" class="absolute top-20 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-full font-semibold text-sm shadow-lg shadow-emerald-900/50 flex items-center gap-2 transition-all duration-300 toast-enter z-50 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            Data Disimpan!
        </div>
    </div>

    <!-- FIREBASE SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, deleteDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBbPD2u_3P_HcgHBs1uLrkXV3CKKUw64HQ",
            authDomain: "ga-security-afd58.firebaseapp.com",
            projectId: "ga-security-afd58",
            storageBucket: "ga-security-afd58.firebasestorage.app",
            messagingSenderId: "335637796681",
            appId: "1:335637796681:web:84559dbdf54eadc3bf2c98"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Elements
        const listView = document.getElementById('listView');
        const formView = document.getElementById('formView');
        const btnBackList = document.getElementById('btnBackList');
        const btnToPortal = document.getElementById('btnToPortal');
        const headerTitle = document.getElementById('headerTitle');
        const headerSubtitle = document.getElementById('headerSubtitle');
        const pendingListContainer = document.getElementById('pendingListContainer');
        const emptyState = document.getElementById('emptyState');
        const badgeCount = document.getElementById('badgeCount');
        
        const formName = document.getElementById('formName');
        const formDept = document.getElementById('formDept');
        const inputTujuan = document.getElementById('inputTujuan');
        const inputCatatan = document.getElementById('inputCatatan');
        const inputEstimasi = document.getElementById('inputEstimasi');
        const boxEstimasi = document.getElementById('boxEstimasi');
        const btnSubmit = document.getElementById('btnSubmit');
        const toast = document.getElementById('toast');

        // Pill Buttons
        const btnPillKembali = document.getElementById('btnPillKembali');
        const btnPillPulang = document.getElementById('btnPillPulang');

        let selectedUser = null; 
        let statusKepulangan = "Kembali ke Plant"; // Default awal

        // 1. LOGIKA PILIHAN PILL BUTTON (Kembali / Langsung Pulang)
        btnPillKembali.addEventListener('click', () => {
            statusKepulangan = "Kembali ke Plant";
            btnPillKembali.className = "py-3 px-3 rounded-xl border text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all border-emerald-500 bg-emerald-500/20 text-emerald-300";
            btnPillPulang.className = "py-3 px-3 rounded-xl border border-slate-700 bg-slate-800/60 text-slate-400 text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all";
            
            boxEstimasi.classList.remove('hidden');
            validateForm();
        });

        btnPillPulang.addEventListener('click', () => {
            statusKepulangan = "Langsung Pulang";
            btnPillPulang.className = "py-3 px-3 rounded-xl border text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all border-emerald-500 bg-emerald-500/20 text-emerald-300";
            btnPillKembali.className = "py-3 px-3 rounded-xl border border-slate-700 bg-slate-800/60 text-slate-400 text-xs font-bold uppercase tracking-wider flex items-center justify-center gap-2 transition-all";
            
            boxEstimasi.classList.add('hidden');
            validateForm();
        });

        // 2. NAVIGASI VIEW
        function openFormView(user) {
            selectedUser = user;
            formName.textContent = user.nama;
            formDept.textContent = user.departemen;
            
            // Set Default Estimasi Jam (Misal: +1 jam dari sekarang)
            const now = new Date();
            now.setHours(now.getHours() + 1);
            inputEstimasi.value = now.toTimeString().slice(0, 5);

            listView.classList.remove('slide-left-active');
            listView.classList.add('slide-left-enter', 'hidden');
            formView.classList.remove('hidden', 'slide-right-enter');
            formView.classList.add('slide-right-active');
            
            btnBackList.classList.remove('hidden');
            btnToPortal.classList.add('hidden');
            headerTitle.textContent = "Lengkapi Data";
            headerSubtitle.textContent = "Alasan & Estimasi";
            validateForm();
        }

        function closeModalView() {
            inputTujuan.value = '';
            inputCatatan.value = '';
            selectedUser = null;
            validateForm();

            formView.classList.remove('slide-right-active');
            formView.classList.add('slide-right-enter', 'hidden');
            listView.classList.remove('hidden', 'slide-left-enter');
            listView.classList.add('slide-left-active');
            
            btnBackList.classList.add('hidden');
            btnToPortal.classList.remove('hidden');
            headerTitle.textContent = "Antrean Izin Keluar";
            headerSubtitle.textContent = "Input Security";
        }

        btnBackList.addEventListener('click', closeModalView);

        // 3. REAL-TIME LISTENER ANTREAN
        onSnapshot(collection(db, "pending_izin"), (snapshot) => {
            let count = 0;
            Array.from(pendingListContainer.children).forEach(child => {
                if (child.id !== 'emptyState') child.remove();
            });

            snapshot.forEach((docSnap) => {
                count++;
                const data = docSnap.data();
                data.uid = docSnap.id; 

                const card = document.createElement('div');
                card.className = "bg-slate-800/80 border border-slate-700 p-4 rounded-xl flex items-center justify-between active:scale-95 transition-transform cursor-pointer shadow-sm mb-3";
                card.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-slate-300 shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </div>
                        <div class="truncate">
                            <p class="font-bold text-white text-sm truncate">${data.nama}</p>
                            <p class="text-xs text-slate-400 truncate">${data.departemen}</p>
                        </div>
                    </div>
                    <div class="text-emerald-400 shrink-0 pl-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                        </svg>
                    </div>
                `;
                card.addEventListener('click', () => openFormView(data));
                pendingListContainer.appendChild(card);
            });

            badgeCount.textContent = `${count} Orang`;
            emptyState.style.display = count === 0 ? 'flex' : 'none';
        });

        // 4. VALIDASI & SUBMIT
        function validateForm() {
            const isTujuanValid = inputTujuan.value !== "";
            const isCatatanValid = inputCatatan.value.trim() !== "";
            const isEstimasiValid = statusKepulangan === "Langsung Pulang" ? true : inputEstimasi.value !== "";

            if (isTujuanValid && isCatatanValid && isEstimasiValid) {
                btnSubmit.disabled = false;
                btnSubmit.className = "w-full mt-6 bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-900/50 font-bold rounded-xl py-4 uppercase tracking-widest text-sm transition-all duration-300 flex items-center justify-center";
            } else {
                btnSubmit.disabled = true;
                btnSubmit.className = "w-full mt-6 bg-slate-700 text-slate-400 font-bold rounded-xl py-4 uppercase tracking-widest text-sm transition-all duration-300 flex items-center justify-center";
            }
        }

        inputTujuan.addEventListener('change', validateForm);
        inputCatatan.addEventListener('input', validateForm);
        inputEstimasi.addEventListener('input', validateForm);

        btnSubmit.addEventListener('click', async () => {
            if (btnSubmit.disabled || !selectedUser) return;

            const btnOriginalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = `<div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;
            btnSubmit.disabled = true;

            const finalEstimasi = statusKepulangan === "Kembali ke Plant" ? inputEstimasi.value : "-";

            try {
                // A. Simpan Rekam Jejak Log
                await addDoc(collection(db, "alasan_izin_keluar"), {
                    uid: selectedUser.uid,
                    nama: selectedUser.nama,
                    departemen: selectedUser.departemen,
                    kategori_tujuan: inputTujuan.value,
                    catatan: inputCatatan.value.trim(),
                    status_kepulangan: statusKepulangan,
                    estimasi_kembali: finalEstimasi,
                    waktu_input: new Date().toISOString()
                });

                // B. LIVE UPDATE KE MODUL B (Menyinkronkan Alasan & Status Kepulangan)
                await setDoc(doc(db, "status_izin_keluar", selectedUser.uid), {
                    kategori_tujuan: inputTujuan.value,
                    catatan_alasan: inputCatatan.value.trim(),
                    status_kepulangan: statusKepulangan,
                    estimasi_kembali: finalEstimasi
                }, { merge: true });

                // C. Hapus dari Antrean Mobile
                await deleteDoc(doc(db, "pending_izin", selectedUser.uid));

                toast.classList.remove('toast-enter');
                toast.classList.add('toast-active');
                
                setTimeout(() => {
                    toast.classList.remove('toast-active');
                    toast.classList.add('toast-enter');
                    closeModalView(); 
                }, 2000);

            } catch (error) {
                console.error("Gagal:", error);
                alert("Gagal menyimpan data ke jaringan.");
                btnSubmit.innerHTML = btnOriginalText;
                validateForm();
            }
        });
    </script>
</body>
</html>
