<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Security - Izin Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { overscroll-behavior-y: none; }
        .slide-left-enter { transform: translateX(100%); opacity: 0; }
        .slide-left-active { transform: translateX(0); opacity: 1; transition: all 0.3s ease-out; }
        .slide-right-enter { transform: translateX(-100%); opacity: 0; }
        .slide-right-active { transform: translateX(0); opacity: 1; transition: all 0.3s ease-out; }
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-active { transform: translateY(0); opacity: 1; }
        
        /* Custom Input Time Icon Color */
        input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: 0.5; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased h-screen flex justify-center overflow-hidden">

    <div class="w-full max-w-md bg-slate-900 h-full flex flex-col relative shadow-2xl border-x border-slate-800 overflow-hidden">
        
        <!-- HEADER -->
        <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 px-6 py-4 flex items-center justify-between sticky top-0 z-20">
            <div class="flex items-center">
                <!-- Tombol Portal (Muncul di List View) -->
                <button id="btnPortal" onclick="window.location.href='portal_mobile.html'" class="w-10 h-10 -ml-2 mr-2 rounded-full flex items-center justify-center text-slate-400 hover:text-emerald-400 hover:bg-slate-700 transition" title="Kembali ke Portal">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                </button>
                <!-- Tombol Back (Muncul di Form View) -->
                <button id="btnBack" class="hidden w-10 h-10 -ml-2 mr-2 rounded-full flex items-center justify-center text-emerald-400 hover:bg-slate-700 transition" title="Kembali ke Antrean">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                    </svg>
                </button>
                
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide" id="headerTitle">Antrean Izin</h1>
                    <p class="text-[0.65rem] text-emerald-400 font-medium tracking-widest uppercase" id="headerSubtitle">Pilih Karyawan</p>
                </div>
            </div>
            
            <button id="btnInjectPending" class="text-[0.6rem] bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-slate-300 uppercase tracking-wider transition">
                Test Scan
            </button>
        </header>

        <!-- VIEW 1: DAFTAR ANTREAN -->
        <main id="listView" class="flex-grow overflow-y-auto p-5 pb-24 slide-left-active w-full absolute top-[72px] bottom-0">
            <div class="flex justify-between items-end mb-4">
                <p class="text-xs font-semibold text-slate-400 uppercase tracking-widest">Belum Di-input</p>
                <span class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2 py-1 rounded-md border border-emerald-500/30" id="badgeCount">0 Orang</span>
            </div>

            <div id="pendingListContainer" class="space-y-3">
                <div id="emptyState" class="flex flex-col items-center justify-center h-48 text-slate-500">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12 mb-2 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                    </svg>
                    <p class="text-sm">Tidak ada antrean input alasan.</p>
                </div>
            </div>
        </main>

        <!-- VIEW 2: FORM INPUT ALASAN -->
        <main id="formView" class="flex-grow overflow-y-auto p-5 pb-24 hidden w-full absolute top-[72px] bottom-0 bg-slate-900 z-10 custom-scrollbar">
            
            <!-- Info Karyawan -->
            <div class="bg-emerald-900/20 border border-emerald-500/30 rounded-2xl p-4 mb-6 flex items-center gap-4 shadow-lg shadow-emerald-900/10">
                <div class="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                    </svg>
                </div>
                <div class="overflow-hidden">
                    <p class="text-[0.65rem] text-emerald-400 font-semibold uppercase tracking-widest mb-0.5">Target Input</p>
                    <h2 id="formName" class="text-lg font-bold text-white truncate">Nama Karyawan</h2>
                    <p id="formDept" class="text-sm text-slate-400 truncate">Departemen</p>
                </div>
            </div>

            <!-- Form Inputs -->
            <div class="space-y-5">
                
                <!-- Status Kepulangan -->
                <div class="p-4 bg-slate-800/50 border border-slate-700 rounded-2xl">
                    <label class="block text-xs font-semibold text-emerald-400 uppercase tracking-widest mb-3">Status Kepulangan</label>
                    <div class="flex gap-4">
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="statusPulang" value="Kembali ke Plant" class="peer hidden" checked>
                            <div class="text-center py-3 px-2 rounded-xl border border-slate-600 text-slate-400 peer-checked:bg-emerald-500/20 peer-checked:border-emerald-500 peer-checked:text-emerald-400 font-semibold text-sm transition">
                                Kembali ke Plant
                            </div>
                        </label>
                        <label class="flex-1 cursor-pointer">
                            <input type="radio" name="statusPulang" value="Langsung Pulang" class="peer hidden">
                            <div class="text-center py-3 px-2 rounded-xl border border-slate-600 text-slate-400 peer-checked:bg-blue-500/20 peer-checked:border-blue-500 peer-checked:text-blue-400 font-semibold text-sm transition">
                                Langsung Pulang
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Estimasi Waktu Kembali (Bisa di-hide) -->
                <div id="containerEstimasi" class="transition-all duration-300 ease-in-out">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        Estimasi Jam Masuk Kembali
                    </label>
                    <input type="time" id="inputEstimasi" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 shadow-inner font-mono text-lg">
                </div>

                <hr class="border-slate-700/50">

                <!-- Kategori Tujuan -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Kategori Tujuan</label>
                    <select id="inputTujuan" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 appearance-none shadow-inner">
                        <option value="" disabled selected>Pilih Kategori...</option>
                        <option value="Keperluan Dinas">Keperluan Dinas (Pekerjaan)</option>
                        <option value="Keperluan Pribadi">Keperluan Pribadi / Darurat</option>
                        <option value="Lain-lain">Lain-lain</option>
                    </select>
                </div>

                <!-- Detail Alasan -->
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Detail Alasan / Catatan</label>
                    <textarea id="inputCatatan" rows="3" placeholder="Ketik rincian spesifik..." class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition resize-none shadow-inner"></textarea>
                </div>
            </div>

            <button id="btnSubmit" disabled class="w-full mt-8 bg-slate-700 text-slate-400 font-bold rounded-xl py-4 uppercase tracking-widest transition-all duration-300 flex items-center justify-center">
                Simpan Data
            </button>
        </main>

        <!-- TOAST NOTIFICATION -->
        <div id="toast" class="absolute top-20 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-full font-semibold shadow-lg shadow-emerald-900/50 flex items-center gap-2 transition-all duration-300 toast-enter z-50 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            Data Disimpan & Disinkronkan!
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, deleteDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBbPD2u_3P_HcgHBs1uLrkXV3CKKUw64HQ",
            authDomain: "ga-security-afd58.firebaseapp.com",
            projectId: "ga-security-afd58",
            storageBucket: "ga-security-afd58.firebasestorage.app",
            messagingSenderId: "335637796681",
            appId: "1:335637796681:web:84559dbdf54eadc3bf2c98"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Elements
        const listView = document.getElementById('listView');
        const formView = document.getElementById('formView');
        const btnBack = document.getElementById('btnBack');
        const btnPortal = document.getElementById('btnPortal');
        const headerTitle = document.getElementById('headerTitle');
        const headerSubtitle = document.getElementById('headerSubtitle');
        const btnInjectPending = document.getElementById('btnInjectPending');
        const pendingListContainer = document.getElementById('pendingListContainer');
        const emptyState = document.getElementById('emptyState');
        const badgeCount = document.getElementById('badgeCount');
        
        const formName = document.getElementById('formName');
        const formDept = document.getElementById('formDept');
        
        const radioStatusPulang = document.querySelectorAll('input[name="statusPulang"]');
        const containerEstimasi = document.getElementById('containerEstimasi');
        const inputEstimasi = document.getElementById('inputEstimasi');
        const inputTujuan = document.getElementById('inputTujuan');
        const inputCatatan = document.getElementById('inputCatatan');
        const btnSubmit = document.getElementById('btnSubmit');
        const toast = document.getElementById('toast');

        let selectedUser = null; 

        // 1. NAVIGASI VIEW
        function openFormView(user) {
            selectedUser = user;
            formName.textContent = user.nama;
            formDept.textContent = user.departemen;
            
            // Set Default (Kembali ke Plant)
            document.querySelector('input[name="statusPulang"][value="Kembali ke Plant"]').checked = true;
            containerEstimasi.classList.remove('hidden', 'opacity-0');
            inputEstimasi.value = '';
            
            listView.classList.remove('slide-left-active');
            listView.classList.add('slide-left-enter', 'hidden');
            formView.classList.remove('hidden', 'slide-right-enter');
            formView.classList.add('slide-right-active');
            
            btnPortal.classList.add('hidden');
            btnBack.classList.remove('hidden');
            headerTitle.textContent = "Input Alasan";
            headerSubtitle.textContent = "Lengkapi Form";
        }

        function closeModalView() {
            inputTujuan.value = '';
            inputCatatan.value = '';
            inputEstimasi.value = '';
            selectedUser = null;
            validateForm();

            formView.classList.remove('slide-right-active');
            formView.classList.add('slide-right-enter', 'hidden');
            listView.classList.remove('hidden', 'slide-left-enter');
            listView.classList.add('slide-left-active');
            
            btnBack.classList.add('hidden');
            btnPortal.classList.remove('hidden');
            headerTitle.textContent = "Antrean Izin";
            headerSubtitle.textContent = "Pilih Karyawan";
        }

        btnBack.addEventListener('click', closeModalView);

        // 2. LOGIKA TOGGLE STATUS KEPULANGAN
        radioStatusPulang.forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === 'Langsung Pulang') {
                    containerEstimasi.classList.add('opacity-0', 'h-0', 'overflow-hidden', 'mb-0');
                    setTimeout(() => containerEstimasi.classList.add('hidden'), 300);
                    inputEstimasi.value = ''; // Kosongkan nilai
                } else {
                    containerEstimasi.classList.remove('hidden');
                    setTimeout(() => containerEstimasi.classList.remove('opacity-0', 'h-0', 'overflow-hidden', 'mb-0'), 10);
                }
                validateForm();
            });
        });

        // 3. REAL-TIME LISTENER UNTUK ANTREAN INPUT
        onSnapshot(collection(db, "pending_izin"), (snapshot) => {
            let count = 0;
            Array.from(pendingListContainer.children).forEach(child => {
                if (child.id !== 'emptyState') child.remove();
            });

            snapshot.forEach((docSnap) => {
                count++;
                const data = docSnap.data();
                data.uid = docSnap.id; 

                const card = document.createElement('div');
                card.className = "bg-slate-800/80 border border-slate-700 p-4 rounded-xl flex items-center justify-between active:scale-95 transition-transform cursor-pointer shadow-sm mb-3";
                card.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <div class="w-10 h-10 rounded-full bg-slate-700 flex items-center justify-center text-slate-300 shrink-0">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                        </div>
                        <div class="truncate">
                            <p class="font-bold text-white text-sm truncate">${data.nama}</p>
                            <p class="text-xs text-slate-400 truncate">${data.departemen}</p>
                        </div>
                    </div>
                    <div class="text-emerald-400 shrink-0 pl-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" /></svg>
                    </div>
                `;
                card.addEventListener('click', () => openFormView(data));
                pendingListContainer.appendChild(card);
            });

            badgeCount.textContent = `${count} Orang`;
            emptyState.style.display = count === 0 ? 'flex' : 'none';
        });

        // 4. VALIDASI FORM & PENGIRIMAN DATA
        function validateForm() {
            const statusPulangVal = document.querySelector('input[name="statusPulang"]:checked').value;
            let isEstimasiValid = true;

            // Wajib isi estimasi jika kembali ke plant
            if (statusPulangVal === 'Kembali ke Plant' && inputEstimasi.value === "") {
                isEstimasiValid = false;
            }

            if (inputTujuan.value !== "" && inputCatatan.value.trim() !== "" && isEstimasiValid) {
                btnSubmit.disabled = false;
                btnSubmit.className = "w-full mt-8 bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-900/50 font-bold rounded-xl py-4 uppercase tracking-widest transition-all duration-300 flex items-center justify-center";
            } else {
                btnSubmit.disabled = true;
                btnSubmit.className = "w-full mt-8 bg-slate-700 text-slate-400 font-bold rounded-xl py-4 uppercase tracking-widest transition-all duration-300 flex items-center justify-center";
            }
        }

        inputEstimasi.addEventListener('input', validateForm);
        inputTujuan.addEventListener('change', validateForm);
        inputCatatan.addEventListener('input', validateForm);

        btnSubmit.addEventListener('click', async () => {
            if (btnSubmit.disabled || !selectedUser) return;

            const btnOriginalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = `<div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;
            btnSubmit.disabled = true;

            const statusPulangFinal = document.querySelector('input[name="statusPulang"]:checked').value;
            const estimasiFinal = statusPulangFinal === 'Kembali ke Plant' ? inputEstimasi.value : null;

            try {
                // A. Simpan log rekam jejak historis
                await addDoc(collection(db, "alasan_izin_keluar"), {
                    uid: selectedUser.uid,
                    nama: selectedUser.nama,
                    departemen: selectedUser.departemen,
                    kategori_tujuan: inputTujuan.value,
                    catatan: inputCatatan.value.trim(),
                    status_kepulangan: statusPulangFinal,
                    estimasi_kembali: estimasiFinal,
                    waktu_input: new Date().toISOString()
                });

                // B. UPDATE MONITOR UTAMA SECARA LIVE (Termasuk Status Kepulangan & Estimasi)
                await setDoc(doc(db, "status_izin_keluar", selectedUser.uid), {
                    kategori_tujuan: inputTujuan.value,
                    catatan_alasan: inputCatatan.value.trim(),
                    status_kepulangan: statusPulangFinal,
                    estimasi_kembali: estimasiFinal
                }, { merge: true });

                // C. Hapus dari daftar antrean
                await deleteDoc(doc(db, "pending_izin", selectedUser.uid));

                // Animasi Sukses
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-active');
                
                setTimeout(() => {
                    toast.classList.remove('toast-active');
                    toast.classList.add('toast-enter');
                    closeModalView(); 
                }, 2000);

            } catch (error) {
                console.error("Gagal:", error);
                alert("Gagal menyimpan data ke jaringan.");
                btnSubmit.innerHTML = btnOriginalText;
                validateForm();
            }
        });

        // 5. TOMBOL INJECT DATA TEST 
        btnInjectPending.addEventListener('click', async () => {
            btnInjectPending.textContent = "Loading...";
            const now = new Date();
            const timeString = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', hour12: false }).replace(/\./g, ':');

            try {
                // Dummy 1: R.A. Sugiantoro
                await setDoc(doc(db, "status_izin_keluar", "111"), { nama: "R. A. Sugiantoro", departemen: "HRDGA Asst.Manager", waktuKeluar: timeString, catatan_alasan: "" });
                await setDoc(doc(db, "pending_izin", "111"), { nama: "R. A. Sugiantoro", departemen: "HRDGA Asst.Manager" });
                
                // Dummy 2: Lala
                await setDoc(doc(db, "status_izin_keluar", "333"), { nama: "Lala", departemen: "Staff Production", waktuKeluar: timeString, catatan_alasan: "" });
                await setDoc(doc(db, "pending_izin", "333"), { nama: "Lala", departemen: "Staff Production" });
                
                btnInjectPending.textContent = "Test Scan";
            } catch (e) {
                alert("Gagal inject data: " + e.message);
            }
        });
    </script>
</body>
</html>
