<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Security - Izin Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Mencegah efek bounce scroll di iOS */
        body { overscroll-behavior-y: none; }
        /* Transisi halus untuk notifikasi */
        .toast-enter { transform: translateY(100%); opacity: 0; }
        .toast-active { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased h-screen flex justify-center">

    <div class="w-full max-w-md bg-slate-900 h-full flex flex-col relative shadow-2xl border-x border-slate-800 overflow-hidden">
        
        <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 px-6 py-4 flex items-center sticky top-0 z-20">
            <button class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-slate-400 hover:bg-slate-700 hover:text-white transition">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7" />
                </svg>
            </button>
            <div class="ml-2">
                <h1 class="text-lg font-bold text-white tracking-wide">Input Izin Keluar</h1>
                <p class="text-xs text-emerald-400 font-medium tracking-widest uppercase">Modul Security</p>
            </div>
        </header>

        <main class="flex-grow overflow-y-auto p-6 pb-24">
            
            <div class="mb-6">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Scan / Ketik UID Karyawan</label>
                <div class="flex gap-3">
                    <input type="text" id="inputUid" placeholder="Contoh: 111" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition font-mono">
                    <button id="btnCari" class="bg-emerald-600 hover:bg-emerald-500 text-white rounded-xl px-5 font-semibold transition shadow-lg shadow-emerald-900/50 flex items-center justify-center">
                        Cari
                    </button>
                </div>
                <p id="searchStatus" class="text-xs text-red-400 mt-2 hidden">Karyawan tidak ditemukan.</p>
            </div>

            <div id="profilCard" class="bg-slate-800/50 border border-slate-700 rounded-2xl p-5 mb-8 hidden transition-all">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center border border-emerald-500/30">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                    </div>
                    <div>
                        <h2 id="profilName" class="text-lg font-bold text-white">Nama Karyawan</h2>
                        <p id="profilDept" class="text-sm text-slate-400">Departemen</p>
                    </div>
                </div>
            </div>

            <div id="formAlasan" class="space-y-5 opacity-50 pointer-events-none transition-opacity">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Tujuan Keluar</label>
                    <select id="inputTujuan" class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 appearance-none">
                        <option value="" disabled selected>Pilih Kategori...</option>
                        <option value="Keperluan Dinas">Keperluan Dinas (Pekerjaan)</option>
                        <option value="Keperluan Pribadi">Keperluan Pribadi / Darurat</option>
                        <option value="Lain-lain">Lain-lain</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">Detail Alasan / Catatan</label>
                    <textarea id="inputCatatan" rows="4" placeholder="Ketik alasan spesifik di sini..." class="w-full bg-slate-800 border border-slate-600 rounded-xl px-4 py-3 text-white focus:outline-none focus:border-emerald-500 transition resize-none"></textarea>
                </div>
                
            </div>
        </main>

        <div class="fixed bottom-0 w-full max-w-md bg-slate-900 border-t border-slate-800 p-4 pb-6 z-20">
            <button id="btnSubmit" disabled class="w-full bg-slate-700 text-slate-400 font-bold rounded-xl py-4 uppercase tracking-widest transition-all duration-300 flex items-center justify-center">
                Simpan Data
            </button>
        </div>

        <div id="toast" class="absolute top-20 left-1/2 transform -translate-x-1/2 bg-emerald-500 text-white px-6 py-3 rounded-full font-semibold shadow-lg shadow-emerald-900/50 flex items-center gap-2 transition-all duration-300 toast-enter z-50 pointer-events-none">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            Data Berhasil Disimpan!
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBbPD2u_3P_HcgHBs1uLrkXV3CKKUw64HQ",
            authDomain: "ga-security-afd58.firebaseapp.com",
            projectId: "ga-security-afd58",
            storageBucket: "ga-security-afd58.firebasestorage.app",
            messagingSenderId: "335637796681",
            appId: "1:335637796681:web:84559dbdf54eadc3bf2c98"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // UI Elements
        const inputUid = document.getElementById('inputUid');
        const btnCari = document.getElementById('btnCari');
        const searchStatus = document.getElementById('searchStatus');
        
        const profilCard = document.getElementById('profilCard');
        const profilName = document.getElementById('profilName');
        const profilDept = document.getElementById('profilDept');
        
        const formAlasan = document.getElementById('formAlasan');
        const inputTujuan = document.getElementById('inputTujuan');
        const inputCatatan = document.getElementById('inputCatatan');
        const btnSubmit = document.getElementById('btnSubmit');
        const toast = document.getElementById('toast');

        let currentUser = null; // Menyimpan data user yang sedang dicari

        // 1. FUNGSI PENCARIAN KARYAWAN
        async function cariKaryawan() {
            const uid = inputUid.value.trim();
            if(!uid) return;

            // Loading state
            btnCari.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;
            searchStatus.classList.add('hidden');

            try {
                const docRef = doc(db, "users", uid);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    currentUser = docSnap.data();
                    currentUser.uid = uid;

                    // Tampilkan Profil
                    profilName.textContent = currentUser.nama;
                    profilDept.textContent = currentUser.departemen;
                    profilCard.classList.remove('hidden');

                    // Buka Kunci Form
                    formAlasan.classList.remove('opacity-50', 'pointer-events-none');
                    validateForm(); // Cek jika form valid untuk menyalakan tombol submit

                } else {
                    // Karyawan tidak ditemukan
                    currentUser = null;
                    profilCard.classList.add('hidden');
                    formAlasan.classList.add('opacity-50', 'pointer-events-none');
                    btnSubmit.disabled = true;
                    btnSubmit.className = "w-full bg-slate-700 text-slate-400 font-bold rounded-xl py-4 uppercase tracking-widest transition-all duration-300 flex items-center justify-center";
                    
                    searchStatus.classList.remove('hidden');
                }
            } catch (error) {
                console.error("Error mencari data: ", error);
            } finally {
                btnCari.innerHTML = "Cari"; // Reset tombol
            }
        }

        // Trigger pencarian saat klik tombol atau tekan Enter
        btnCari.addEventListener('click', cariKaryawan);
        inputUid.addEventListener('keypress', (e) => { if (e.key === 'Enter') cariKaryawan(); });

        // 2. VALIDASI FORM
        function validateForm() {
            if (currentUser && inputTujuan.value !== "" && inputCatatan.value.trim() !== "") {
                btnSubmit.disabled = false;
                btnSubmit.className = "w-full bg-emerald-600 hover:bg-emerald-500 text-white shadow-lg shadow-emerald-900/50 font-bold rounded-xl py-4 uppercase tracking-widest transition-all duration-300 flex items-center justify-center";
            } else {
                btnSubmit.disabled = true;
                btnSubmit.className = "w-full bg-slate-700 text-slate-400 font-bold rounded-xl py-4 uppercase tracking-widest transition-all duration-300 flex items-center justify-center";
            }
        }

        inputTujuan.addEventListener('change', validateForm);
        inputCatatan.addEventListener('input', validateForm);

        // 3. PROSES SIMPAN KE FIREBASE
        btnSubmit.addEventListener('click', async () => {
            if (btnSubmit.disabled) return;

            const btnOriginalText = btnSubmit.innerHTML;
            btnSubmit.innerHTML = `<div class="w-6 h-6 border-2 border-white border-t-transparent rounded-full animate-spin"></div>`;
            btnSubmit.disabled = true;

            try {
                // Simpan alasan ke Firestore (Koleksi baru khusus alasan izin)
                await addDoc(collection(db, "alasan_izin_keluar"), {
                    uid: currentUser.uid,
                    nama: currentUser.nama,
                    departemen: currentUser.departemen,
                    kategori_tujuan: inputTujuan.value,
                    catatan: inputCatatan.value.trim(),
                    waktu_input: new Date().toISOString()
                });

                // Tampilkan Toast Sukses
                toast.classList.remove('toast-enter');
                toast.classList.add('toast-active');
                
                // Reset Form
                setTimeout(() => {
                    toast.classList.remove('toast-active');
                    toast.classList.add('toast-enter');
                    
                    inputUid.value = '';
                    inputTujuan.value = '';
                    inputCatatan.value = '';
                    profilCard.classList.add('hidden');
                    formAlasan.classList.add('opacity-50', 'pointer-events-none');
                    currentUser = null;
                    validateForm();
                    
                }, 2500);

            } catch (error) {
                console.error("Gagal menyimpan data:", error);
                alert("Gagal menyimpan data jaringan.");
                btnSubmit.innerHTML = btnOriginalText;
                validateForm();
            }
        });
    </script>
</body>
</html>
