<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Control System - HRDGA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animasi pergerakan background yang halus dan elegan */
        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .bg-animated {
            background: linear-gradient(-45deg, #0f172a, #1e293b, #0f2027, #111827);
            background-size: 400% 400%;
            animation: gradientMove 15s ease infinite;
        }

        /* Efek glow premium untuk jam */
        .text-glow {
            text-shadow: 0 0 30px rgba(59, 130, 246, 0.4), 0 0 10px rgba(255, 255, 255, 0.1);
        }

        /* Container tombol untuk efek pembesaran ala macOS Dock */
        .mac-dock:hover > button {
            /* Saat dock di-hover, tombol yang tidak di-hover sedikit mengecil/meredup (opsional) */
            opacity: 0.7;
        }
        .mac-dock > button:hover {
            opacity: 1;
            transform: scale(1.6) translateY(-4px);
            z-index: 50;
            margin: 0 12px;
        }
    </style>
</head>
<body class="bg-animated h-screen flex flex-col justify-center items-center overflow-hidden relative font-sans text-slate-100">

    <div class="absolute top-8 right-8 flex items-center space-x-3 mac-dock transition-all duration-300">
        
        <button onclick="window.location.href='modul_a.html'" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/20 shadow-lg flex items-center justify-center text-slate-300 hover:text-blue-400 hover:bg-blue-900/40 hover:border-blue-400/50 transition-all duration-300 ease-out" title="Kontrol HP">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3" />
            </svg>
        </button>

        <button onclick="window.location.href='modul_b.html'" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/20 shadow-lg flex items-center justify-center text-slate-300 hover:text-green-400 hover:bg-green-900/40 hover:border-green-400/50 transition-all duration-300 ease-out" title="Izin Keluar Plant">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m0-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5" />
            </svg>
        </button>

        <button onclick="window.location.href='modul_c.html'" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md border border-white/20 shadow-lg flex items-center justify-center text-slate-300 hover:text-red-400 hover:bg-red-900/40 hover:border-red-400/50 transition-all duration-300 ease-out" title="Pencatatan Pelanggaran">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2.25m0 4.5h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
            </svg>
        </button>
    </div>

    <div class="text-center mb-10 opacity-90">
        <h1 class="text-3xl md:text-5xl font-extrabold tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-slate-200 to-slate-400 mb-3 drop-shadow-md">
            SECURITY CONTROL SYSTEM
        </h1>
        <h2 class="text-lg md:text-xl text-blue-400/90 font-medium tracking-[0.2em]">
            DEPT HRDGA - SECTION GA
        </h2>
    </div>

    <div class="text-center">
        <div id="clock" class="text-[6rem] md:text-[12rem] font-bold text-white text-glow leading-none tracking-tighter">
            00:00
        </div>
        <div id="date" class="text-xl md:text-3xl text-slate-400 mt-6 font-light tracking-wide">
            Memuat Tanggal...
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            
            // Format Jam (HH:MM) - Tanpa Detik
            const timeString = now.toLocaleTimeString('id-ID', { 
                hour: '2-digit', 
                minute: '2-digit', 
                hour12: false
            }).replace(/\./g, ':'); 
            
            // Format Tanggal
            const dateString = now.toLocaleDateString('id-ID', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });

            document.getElementById('clock').textContent = timeString;
            document.getElementById('date').textContent = dateString;
        }

        // Jalankan setiap 1 detik
        setInterval(updateClock, 1000);
        updateClock(); // Panggil sekali di awal agar tidak delay
    </script>
</body>
</html>
